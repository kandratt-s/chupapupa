  event-service:
    build:
      context: .
      dockerfile: ./services/event/Dockerfile
    env_file:
      - ./services/event/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8006:8000"
    volumes:
      - ./services/event:/app
      - ./shared:/app/shared
    networks:
      - app-network

  user_statistic-service:
    build:
      context: .
      dockerfile: ./services/userStatistic/Dockerfile
    env_file:
      - ./services/userStatistic/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8000"
    volumes:
      - ./services/userStatistic:/app
      - ./shared:/app/shared
    networks:
      - app-network

  web-service:
    build:
      context: .
      dockerfile: ./services/web/Dockerfile
    env_file:
      - ./services/web/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8008:8000"
    volumes:
      - ./services/web:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
