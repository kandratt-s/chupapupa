      context: .
      dockerfile: ./services/attendance/Dockerfile
    env_file:
      - ./services/attendance/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/attendance:/app

  bot-service:
