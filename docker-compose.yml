      - ./services/CV/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/CV:/app

  event-service:
    build:
      context: .
      dockerfile: ./services/event/Dockerfile
    env_file:
      - ./services/event/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/event:/app

  user_statistic-service:
    build:
      context: .
      dockerfile: ./services/userStatistic/Dockerfile
    env_file:
      - ./services/userStatistic/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/userStatistic:/app

  web-service:
    build:
      context: .
      dockerfile: ./services/web/Dockerfile
    env_file:
      - ./services/web/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./services/web:/app
