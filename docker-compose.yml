services:
  postgres:
    extends:
      file: db/docker-compose.postgres.yml
      service: postgres
    networks:
      - app-network

  auth-service:
    build:
      context: . # чтобы иметь возможность загружать файлы за докерфайлом (requirements-base.txt)
      dockerfile: ./services/auth/Dockerfile
    env_file:
      - ./services/auth/.env  # Загружаем переменные из .env файла сервиса
    environment:
      - PYTHONPATH=/app
    depends_on:
      # Ожидаем готовности Postgres перед запуском сервиса
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - app-network

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
    env_file:
      - ./services/admin/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - app-network

  attendance-service:
    build:
      context: .
      dockerfile: ./services/attendance/Dockerfile
    env_file:
      - ./services/attendance/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"
    volumes:
      - ./services/attendance:/app
      - ./shared:/app/shared
    networks:
      - app-network

  bot-service:
    build:
      context: .
      dockerfile: ./services/bot/Dockerfile
    env_file:
      - ./services/bot/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"
    volumes:
      - ./services/bot:/app
    networks:
      - app-network

