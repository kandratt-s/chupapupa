services:
  # =====================================================
  # БАЗА ДАННЫХ
  # =====================================================
  postgres:
    extends:
      file: db/docker-compose.postgres.yml
      service: postgres
    networks:
      - internal-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chupapupa -d chupapupa_pj"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # ОБЩЕЕ ХРАНИЛИЩЕ ДЛЯ ФОТОГРАФИЙ
  # =====================================================
  photos-volume:
    image: alpine:latest
    volumes:
      - photos_data:/shared/photos
    command: |
      sh -c "
        echo '🔧 Инициализация структуры папок для фотографий...' &&
        mkdir -p /shared/photos/faces /shared/photos/attendances &&
        chmod -R 755 /shared/photos &&
        chown -R 1000:1000 /shared/photos &&
        echo '✅ Структура папок создана:' &&
        echo '  - /shared/photos/faces/ - фотографии пользователей' &&
        echo '  - /shared/photos/attendances/ - файлы посещений' &&
        echo '🔒 Права доступа: 755, владелец: 1000:1000' &&
        ls -la /shared/photos/ &&
        tail -f /dev/null
      "
    networks:
      - internal-network
    restart: unless-stopped

  # =====================================================
  # ВНУТРЕННИЕ МИКРОСЕРВИСЫ (без внешнего доступа)
  # =====================================================

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://auth_user:auth_pass@postgres:5432/chupapupa_pj
      - PHOTOS_PATH=/shared/photos
    expose:
      - "8001"  # Внутренний порт, не доступен снаружи
    depends_on:
      postgres:
        condition: service_healthy
      photos-volume:
        condition: service_started
    volumes:
      - photos_data:/shared/photos
    networks:
      - internal-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  event-service:
    build:
      context: ./services/event
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://event_user:event_pass@postgres:5432/chupapupa_pj
    expose:
      - "8004"  # Внутренний порт, не доступен снаружи
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  attendance-service:
    build:
      context: ./services/attendance
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://chupapupa:chupapupaZXC@postgres:5432/chupapupa_pj
      - PHOTOS_PATH=/shared/photos/attendances
      - USER_STATISTIC_SERVICE_URL=http://user-statistic-service:8006
    expose:
      - "8003"  # Внутренний порт, не доступен снаружи
    depends_on:
      postgres:
        condition: service_healthy
      photos-volume:
        condition: service_started
      user-statistic-service:
        condition: service_started
    volumes:
      - photos_data:/shared/photos
    networks:
      - internal-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  user-statistic-service:
    build:
      context: ./services/userStatistic
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://user_statistic_user:user_statistic_pass@postgres:5432/chupapupa_pj
      - PHOTOS_PATH=/shared/photos/faces
    expose:
      - "8006"  # Внутренний порт, не доступен снаружи
    depends_on:
      postgres:
        condition: service_healthy
      photos-volume:
        condition: service_started
    volumes:
      - photos_data:/shared/photos
    networks:
      - internal-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./services/web/gateway_web
      dockerfile: Dockerfile
      network: host
    environment:
      - GATEWAY_URL=http://localhost:8000
    network_mode: host
    # command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.enableCORS=true
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      - photos_data:/shared/photos
    restart: always

  # =====================================================
  # ПУБЛИЧНЫЙ GATEWAY (единственный внешний API доступ)
  # =====================================================

  api-gateway:
    build:
      context: ./services/Gateway
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      # URLs внутренних сервисов
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EVENT_SERVICE_URL=http://event-service:8004
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8003
      - USER_STATISTIC_SERVICE_URL=http://user-statistic-service:8006
      # Безопасность
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:8501
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      user-statistic-service:
        condition: service_healthy
      photos-volume:
        condition: service_started
    volumes:
      - photos_data:/shared/photos
    ports:
      - "8000:8000"  # Единственный внешний API порт
    networks:
      - internal-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# =====================================================
# СЕТИ И ТОМА
# =====================================================

networks:
  internal-network:
    driver: bridge
    # internal: false позволяет Gateway обращаться наружу для healthcheck'ов
    internal: false

volumes:
  postgres_data:
    driver: local
  photos_data:
    driver: local
