[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

# Отключаем конкретные ошибки для SQLAlchemy и Pydantic
disable_error_code = [
    "misc",           # Для BaseSettings
    "attr-defined",   # Для динамических атрибутов SQLAlchemy
    "call-overload",  # Для sessionmaker
]

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "pydantic.*",
    "pydantic_settings.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["B008", "B905"]

[tool.ruff.format]
quote-style = "double"
