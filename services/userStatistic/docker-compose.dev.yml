# =================================================================
# Docker Compose для локальной разработки userStatistic сервиса
#
# ИСПОЛЬЗОВАНИЕ:
# 1. Сначала поднимите PostgreSQL:
#    cd ../../db && docker-compose -f docker-compose.postgres.yml up -d
# 2. Затем запустите сервис:
#    docker-compose -f docker-compose.dev.yml up
#
# ОСТАНОВКА:
# 1. Остановите сервис: docker-compose -f docker-compose.dev.yml down
# 2. При необходимости остановите БД:
#    cd ../../db && docker-compose -f docker-compose.postgres.yml down
# =================================================================

version: '3.8'

services:
  # UserStatistic микросервис
  userstatistic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: userstatistic_service_dev
    environment:
      # Подключение к общей базе данных (должна быть запущена отдельно)
      - DB_HOST=172.17.0.1       # IP-адрес Docker Bridge на Linux
      - DB_PORT=5432
      - DB_NAME=chupapupa_pj          # Имя БД из основного compose файла
      - DB_USER=chupapupa             # Пользователь из основного compose файла
      - DB_PASSWORD=chupapupaZXC      # Пароль из основного compose файла
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - DEBUG=true
      - ENVIRONMENT=development
    ports:
      - "8006:8006"
    volumes:
      # Для локальной разработки - монтируем код
      - ./:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8006", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
